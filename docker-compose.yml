SERVICES:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: bidflow_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: bidflow
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD", "pg_isready", "-U", "postgres" ]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7
    container_name: bidflow_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - redis_data:/data
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: bidflow_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@bidflow.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "8081:80"
    depends_on:
      - postgres
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  pgadmin_data:

  # Backend em Go
  backend:
    build:
      context: ./backend # Ajuste para o caminho da sua pasta de código Go
      dockerfile: Dockerfile
    container_name: bidflow_backend
    environment:
      - DB_SOURCE=postgresql://postgres:postgres@postgres:5432/bidflow?sslmode=disable
      - REDIS_ADDRESS=redis:6379
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Frontend em Next.js
  frontend:
    build:
      context: ./frontend # Ajuste para o caminho da sua pasta Next.js
      dockerfile: Dockerfile
    container_name: bidflow_frontend
    environment:
      - NEXT_PUBLIC_API_URL=https://api.bidflow.com.br
    ports:
      - "3000:3000"
    depends_on:
      - backend

  # Túnel da Cloudflare (Para não precisar do instalador no Windows)
  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: bidflow_tunnel
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    restart: unless-stopped
